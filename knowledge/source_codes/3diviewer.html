<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3DI Viewer · Delta Force</title>
  <style>
    :root{color-scheme:dark;--bg:#070b0e;--panel:#10171b;--line:#26343b;--text:#e5eee8;--muted:#91a39a;--accent:#9fcf62;--danger:#ff756f}

    .examples{display:grid;gap:7px;margin:15px 0 22px}button,select{border:1px solid var(--line);border-radius:7px;background:#182227;color:var(--text);padding:8px 10px;font:inherit}button{cursor:pointer;text-align:left}button:hover{border-color:#657b70}button:disabled,select:disabled{opacity:.45;cursor:not-allowed}

    .stats{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}.row{display:flex;justify-content:space-between;padding:5px 0;color:var(--muted)}.row b{color:var(--text);font-weight:500}.status{min-height:40px;margin-top:16px;color:var(--muted);font-size:12px}.status.error{color:var(--danger)}
    main{position:relative;min-width:0}canvas{width:100%;height:100%;display:block}.hint{position:absolute;right:18px;bottom:14px;color:#b7c7bf88;font-size:11px;pointer-events:none}.badge{position:absolute;top:18px;left:18px;background:#0b1115cc;border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--muted);backdrop-filter:blur(8px)}
    @media(max-width:700px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr}.panel{padding:12px 14px;border-right:0;border-bottom:1px solid var(--line)}.subtitle,.examples,.stats{display:none}.drop{padding:10px}.toolbar{position:absolute;right:12px;top:12px;margin:0;z-index:2;width:180px}.toolbar label{display:none}}
  </style>
</head>
<body>
  <aside class="panel">

    </div>

  </aside>
